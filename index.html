<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EEF4FF">
<title>鬥地主</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,#EEF4FF 0%,#FFFFFF 55%);color:#1B2333;font-family:'Noto Sans TC',system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);height:100dvh;max-width:1120px;margin:0 auto;padding:clamp(10px,1.6vh,18px) 12px clamp(12px,2vh,20px)}
.pill{background:#fff;border-radius:12px;padding:6px 10px;font-size:13px;color:#55607A;box-shadow:0 1px 3px rgba(30,50,90,.1)}
.pill b{color:#1B2333;font-size:15px}
#top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;min-height:40px;flex:none}
@media (max-width:560px){#top .m{order:3;flex-basis:100%;justify-content:center;gap:10px}#top .l{gap:8px}#top.hb .m{display:none}}
#top .l{display:flex;gap:6px}
#top .m{display:flex;align-items:center;gap:6px;font-size:12px;color:#55607A}
#score{font:800 22px 'Outfit',sans-serif;color:#15803D}
#score.neg{color:#D92D3A}
#opps{display:flex;gap:10px;height:108px;flex:none}
.chip{flex:1;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 2px 8px rgba(30,50,90,.08);display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.chip.turn{box-shadow:0 0 0 2px #2557E6,0 2px 8px rgba(30,50,90,.08)}
.chip .who{display:flex;align-items:center;gap:8px}
.chip .sc{margin-left:auto;font:800 17px 'Outfit',sans-serif;color:#15803D;background:#EAF7EF;border-radius:10px;padding:2px 8px}
.chip .sc.neg{color:#D92D3A;background:#FDECEE}
.chip .av{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font:800 16px 'Outfit',sans-serif;flex:none}
.chip .nm{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.chip .nm span:first-child{font-size:14px;font-weight:700}
.chip .nm span:last-child{font-size:12px;font-weight:700}
.chip .bt{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.chip .num{display:flex;align-items:baseline;gap:3px}
.chip .num b{font:800 34px/1 'Outfit',sans-serif}
.chip .num span{font-size:13px;color:#55607A}
.tag{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.t-blue{background:#E3ECFF;color:#1F4FC4}
.t-gray{background:#EEF1F6;color:#55607A}
.t-red{background:#FDE3E5;color:#B42318}
#table{flex:1;min-height:0;border-radius:24px;background:#EAF1FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px);padding:10px;text-align:center;overflow:hidden}
#table .cap{font-size:13px;color:#55607A}
#table .big{background:#fff;border-radius:999px;padding:6px 18px;font-weight:700;font-size:16px;box-shadow:0 1px 3px rgba(30,50,90,.1)}
#table .hint{font-size:13px;color:#55607A;line-height:1.5}
#table .play{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:100%}
#table .bids{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#status{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 4px;flex:none}
#status .a{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
#status .b{font-size:14px;color:#55607A}
#status .b b{font:800 17px 'Outfit',sans-serif;color:#1B2333}
#btns{display:flex;gap:10px;height:52px;flex:none}
.btn{flex:1 1 0;min-width:0;border:0;border-radius:16px;background:#fff;color:#1B2333;font:700 17px 'Noto Sans TC',system-ui,sans-serif;box-shadow:0 1px 4px rgba(30,50,90,.14);cursor:pointer}
.btn.pri{background:#2557E6;color:#fff;font-size:18px;box-shadow:0 6px 12px rgba(37,87,230,.3)}
.btn:disabled{opacity:.35;cursor:default}
.tb{display:flex;gap:10px;width:100%;max-width:420px}
.tbtn{flex:1 1 0;min-width:0;height:clamp(64px,10vh,88px);border:0;border-radius:20px;background:#fff;color:#1B2333;font:800 24px 'Noto Sans TC',system-ui,sans-serif;box-shadow:0 1px 4px rgba(30,50,90,.14);cursor:pointer}
.tbtn.pri{background:#2557E6;color:#fff;box-shadow:0 8px 16px rgba(37,87,230,.3)}
#handbox{position:relative;flex:none;width:100%}
.cd{position:absolute;width:calc(64px*var(--k,1));height:calc(92px*var(--k,1));background:#fff;border:1px solid #D9E1EE;border-radius:calc(10px*var(--k,1));box-shadow:0 2px 6px rgba(30,50,90,.14);color:#1B2333;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s;cursor:pointer}
.cd.rel{position:relative;cursor:default}
.cd.red{color:#D92D3A}
.cd .r{position:absolute;left:calc(8px*var(--k,1));top:calc(5px*var(--k,1));font-family:'Outfit','Noto Sans TC',sans-serif;font-weight:800;font-size:max(11px,calc(27px*var(--k,1)));line-height:1;letter-spacing:-.04em}
.cd .s{position:absolute;left:calc(9px*var(--k,1));top:calc(36px*var(--k,1));font-size:max(10px,calc(24px*var(--k,1)));line-height:1}
.cd.jk .s{font-size:max(10px,calc(22px*var(--k,1)));font-family:'Noto Sans TC',sans-serif;font-weight:700}
.cd.sel{transform:translateY(calc(var(--raise,14px)*-1));border-color:#2557E6;box-shadow:0 0 0 3px #2557E6,0 10px 16px rgba(37,87,230,.28)}
.cd.back{background:repeating-linear-gradient(45deg,#2557E6,#2557E6 4px,#4A7BFF 4px,#4A7BFF 8px);border-color:#2557E6}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:rgba(20,30,50,.85);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:15px}
#ov{position:fixed;inset:0;background:rgba(20,30,50,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov .box{background:#fff;color:#1B2333;border-radius:22px;padding:24px 22px;text-align:center;min-width:270px;line-height:1.8;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#ov h2{margin:0 0 4px;font-size:24px}
#ov .btn{margin-top:14px;padding:12px 28px;flex:none}

/* 橫向 / 電腦大螢幕:對手放左右兩側,桌面居中 */
@media (min-aspect-ratio:5/4){
  #app{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.6fr) minmax(150px,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;grid-template-areas:"top top top" "p2 table p1" "status status status" "btns btns btns" "hand hand hand";column-gap:14px;row-gap:clamp(8px,1.4vh,14px)}
  #top{grid-area:top}
  #opps{display:contents}
  #p2{grid-area:p2}#p1{grid-area:p1}
  #table{grid-area:table}
  #status{grid-area:status}
  #btns{grid-area:btns;width:100%;max-width:560px;justify-self:center}
  #handbox{grid-area:hand}
  .chip{height:auto;justify-content:center;align-items:center;gap:16px;text-align:center}
  .chip .who{flex-direction:column;gap:6px}
  .chip .sc{margin-left:0}
  .chip .nm{align-items:center}
  .chip .bt{flex-direction:column;align-items:center;gap:10px}
  .chip .num b{font-size:48px}
  .chip .av{width:48px;height:48px;border-radius:24px;font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="l"><div class="pill" id="pBase"></div><div class="pill" id="pMult"></div></div>
    <div class="m"><div id="bottom" style="display:flex;gap:6px"></div></div>
    <div id="score"></div>
  </div>
  <div id="opps"><div class="chip" id="p2"></div><div class="chip" id="p1"></div></div>
  <div id="table"></div>
  <div id="status"></div>
  <div id="btns"></div>
  <div id="handbox"></div>
</div>
<div id="toast"></div>
<div id="ov"><div class="box"><h2 id="ovt"></h2><div id="ovd"></div><button class="btn pri" onclick="newGame()">再來一局</button></div></div>

<script>
const $=s=>document.querySelector(s);
const NAMES=['你','電腦A','電腦B'];   // 座位:0=自己 1=右(電腦A) 2=左(電腦B),出牌順序 0→1→2
const SUITS=['♠','♥','♣','♦'];
const LAB={11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小王',17:'大王'};
const TYPE={single:'單張',pair:'對子',triple:'三條',triple1:'三帶一',triple2:'三帶二',straight:'順子',pairs:'連對',plane:'飛機',plane1:'飛機帶單',plane2:'飛機帶對',four2:'四帶二',four2p:'四帶兩對',bomb:'炸彈',rocket:'王炸'};
let S;

/* ---------- 牌型判斷 ---------- */
function count(cards){const m={};cards.forEach(c=>m[c.v]=(m[c.v]||0)+1);return m;}
const isB=a=>a.type=='bomb'||a.type=='rocket';
function analyze(cards){
  const n=cards.length;if(!n)return null;
  const m=count(cards),vs=Object.keys(m).map(Number).sort((a,b)=>a-b),cs=vs.map(v=>m[v]);
  const consec=a=>a.every((v,i)=>i==0||v==a[i-1]+1);
  if(n==2&&m[16]&&m[17])return{type:'rocket',main:17,n};
  if(n==1)return{type:'single',main:vs[0],n};
  if(n==2&&vs.length==1)return{type:'pair',main:vs[0],n};
  if(n==3&&vs.length==1)return{type:'triple',main:vs[0],n};
  if(n==4&&vs.length==1)return{type:'bomb',main:vs[0],n};
  if(n==4&&vs.length==2){const t=vs.find(v=>m[v]==3);if(t)return{type:'triple1',main:t,n};}
  if(n==5&&vs.length==2){const t=vs.find(v=>m[v]==3);if(t&&cs.includes(2))return{type:'triple2',main:t,n};}
  if(n>=5&&vs.length==n&&vs[n-1]<=14&&consec(vs))return{type:'straight',main:vs[n-1],n};
  if(n>=6&&n%2==0&&cs.every(x=>x==2)&&vs[vs.length-1]<=14&&consec(vs))return{type:'pairs',main:vs[vs.length-1],n};
  const four=vs.find(v=>m[v]==4);
  if(four!==undefined){
    if(n==6)return{type:'four2',main:four,n};
    if(n==8&&vs.filter(v=>v!=four).every(v=>m[v]%2==0))return{type:'four2p',main:four,n};
  }
  const T=vs.filter(v=>m[v]>=3&&v<=14);
  for(const [div,kind] of [[3,'plane'],[4,'plane1'],[5,'plane2']]){
    if(n%div)continue;const k=n/div;if(k<2)continue;
    for(let i=T.length-k;i>=0;i--){
      const run=T.slice(i,i+k);if(!consec(run))continue;
      if(kind=='plane2'){const r={...m};run.forEach(v=>r[v]-=3);if(!Object.values(r).every(x=>x%2==0))continue;}
      return{type:kind,main:run[k-1],n};
    }
  }
  return null;
}
function canBeat(a,b){
  if(!b)return true;
  if(a.type=='rocket')return true;
  if(b.type=='rocket')return false;
  if(a.type=='bomb'&&b.type!='bomb')return true;
  return a.type==b.type&&a.n==b.n&&a.main>b.main;
}

/* ---------- 電腦:候選牌 / 叫分 / 出牌 ---------- */
function candidates(hand){
  const g={};hand.forEach(c=>(g[c.v]=g[c.v]||[]).push(c));
  const vs=Object.keys(g).map(Number).sort((a,b)=>a-b),out=[];
  const rng=(s,l)=>Array.from({length:l},(_,i)=>s+i);
  vs.forEach(v=>{
    const a=g[v];out.push([a[0]]);
    if(a.length>=2)out.push(a.slice(0,2));
    if(a.length>=3){
      const t=a.slice(0,3);out.push(t);
      const k1=vs.filter(x=>x!=v).sort((x,y)=>g[x].length-g[y].length||x-y)[0];
      if(k1!==undefined)out.push([...t,g[k1][0]]);
      const k2=vs.filter(x=>x!=v&&g[x].length>=2).sort((x,y)=>g[x].length-g[y].length||x-y)[0];
      if(k2!==undefined)out.push([...t,...g[k2].slice(0,2)]);
    }
    if(a.length==4)out.push(a.slice());
  });
  if(g[16]&&g[17])out.push([g[16][0],g[17][0]]);
  for(let s=3;s<=14;s++){
    let l=0;while(s+l<=14&&g[s+l])l++;
    for(let len=5;len<=l;len++)out.push(rng(s,len).map(x=>g[x][0]));
    let lp=0;while(s+lp<=14&&g[s+lp]&&g[s+lp].length>=2)lp++;
    for(let len=3;len<=lp;len++)out.push(rng(s,len).flatMap(x=>g[x].slice(0,2)));
    let lt=0;while(s+lt<=14&&g[s+lt]&&g[s+lt].length>=3)lt++;
    for(let len=2;len<=lt;len++)out.push(rng(s,len).flatMap(x=>g[x].slice(0,3)));
  }
  return out.map(c=>({c,a:analyze(c)})).filter(x=>x.a);
}
function botBid(h){
  const m=count(h);let s=0;
  if(m[17])s+=2.5;if(m[16])s+=1.5;if(m[16]&&m[17])s+=1;
  s+=(m[15]||0)*1.2;
  Object.keys(m).forEach(v=>{if(m[v]==4)s+=2.5;});
  const want=s>=7?3:s>=5?2:s>=3.5?1:0;
  return want>S.highBid?want:0;
}
function botLead(h){
  const all=candidates(h);
  const out=all.find(x=>x.a.n==h.length);if(out)return out.c;
  let c=all.filter(x=>!isB(x.a));if(!c.length)c=all;
  c.sort((x,y)=>y.a.n-x.a.n||x.a.main-y.a.main);
  return c[0].c;
}
function botFollow(h,last,seat){
  const all=candidates(h).filter(x=>canBeat(x.a,last.a));
  if(!all.length)return null;
  const out=all.find(x=>x.a.n==h.length);if(out)return out.c;
  if(S.landlord!=seat&&last.seat!=S.landlord)return null;      // 隊友出的牌不壓
  const normal=all.filter(x=>!isB(x.a)).sort((x,y)=>x.a.main-y.a.main);
  if(normal.length)return normal[0].c;
  const danger=h.length<=6||S.hands.some((hh,i)=>i!=seat&&!(S.landlord!=seat&&i!=S.landlord)&&hh.length<=4);
  if(danger)return all.filter(x=>isB(x.a)).sort((x,y)=>x.a.main-y.a.main)[0].c;
  return null;
}

/* ---------- 流程 ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
const sortHand=h=>h.sort((a,b)=>b.v-a.v||a.s-b.s);
function newGame(){
  const deck=[];
  for(let v=3;v<=15;v++)for(let s=0;s<4;s++)deck.push({v,s,id:v*4+s});
  deck.push({v:16,s:0,id:100},{v:17,s:0,id:101});
  shuffle(deck);
  S={gid:(S?S.gid:0)+1,scores:S?S.scores:[0,0,0],
     hands:[deck.slice(0,17),deck.slice(17,34),deck.slice(34,51)],bottom:deck.slice(51),
     landlord:-1,phase:'bid',turn:Math.floor(Math.random()*3),highBid:0,highSeat:-1,bidCount:0,
     say:[null,null,null],table:[null,null,null],last:null,passes:0,played:[0,0,0],mult:1,sel:new Set()};
  S.hands.forEach(sortHand);
  $('#ov').style.display='none';
  step();
}
function step(){
  render();
  if(S.phase!='bid'&&S.phase!='play')return;
  const seat=S.turn;if(seat==0)return;
  const gid=S.gid;
  setTimeout(()=>{
    if(S.gid!=gid)return;
    if(S.phase=='bid')applyBid(seat,botBid(S.hands[seat]));
    else if(S.phase=='play')botPlay(seat);
  },900);
}
function applyBid(seat,b){
  S.say[seat]=b?b+'分':'不叫';S.bidCount++;
  if(b>S.highBid){S.highBid=b;S.highSeat=seat;}
  if(b==3||S.bidCount==3){
    if(S.highSeat<0){S.phase='redeal';render();toast('三人都不叫,重新發牌');setTimeout(newGame,1600);return;}
    S.landlord=S.highSeat;S.hands[S.landlord].push(...S.bottom);sortHand(S.hands[S.landlord]);
    S.phase='play';S.turn=S.landlord;S.mult=S.highBid;S.say=[null,null,null];
    toast(NAMES[S.landlord]+'成為地主');
  }else S.turn=(seat+1)%3;
  step();
}
function nextTurn(){S.turn=(S.turn+1)%3;S.table[S.turn]=null;}
function doPlay(seat,cards){
  const a=analyze(cards),ids=new Set(cards.map(c=>c.id));
  S.hands[seat]=S.hands[seat].filter(c=>!ids.has(c.id));
  if(isB(a))S.mult*=2;
  S.played[seat]++;S.last={seat,cards,a};S.passes=0;S.table[seat]=cards;S.sel.clear();
  if(!S.hands[seat].length)return finish(seat);
  nextTurn();step();
}
function doPass(seat){
  S.table[seat]='pass';S.passes++;
  if(S.passes>=2){S.last=null;S.passes=0;S.table=[null,null,null];}
  nextTurn();step();
}
function botPlay(seat){
  const h=S.hands[seat];
  const pick=S.last?botFollow(h,S.last,seat):botLead(h);
  pick?doPlay(seat,pick):doPass(seat);
}
function finish(w){
  const L=S.landlord,lw=(w==L);
  const spring=lw?(S.played[(L+1)%3]==0&&S.played[(L+2)%3]==0):(S.played[L]==1);
  const m=S.mult*(spring?2:1);
  for(let i=0;i<3;i++)S.scores[i]+=lw?(i==L?2*m:-m):(i==L?-2*m:m);
  S.phase='end';S.result={lw,spring,m,w};
  render();
}

/* ---------- 玩家操作 ---------- */
function bid(b){if(S.turn==0&&S.phase=='bid')applyBid(0,b);}
function humanPass(){if(S.turn==0&&S.phase=='play'&&S.last)doPass(0);}
function humanPlay(){
  if(S.turn!=0||S.phase!='play')return;
  const cards=S.hands[0].filter(c=>S.sel.has(c.id)),a=analyze(cards);
  if(!a)return toast('牌型不合法');
  if(!canBeat(a,S.last&&S.last.a))return toast('壓不過上一手');
  doPlay(0,cards);
}
function humanHint(){
  const h=S.hands[0];let pick;
  if(!S.last)pick=botLead(h);
  else{
    const all=candidates(h).filter(x=>canBeat(x.a,S.last.a))
      .sort((x,y)=>(isB(x.a)-isB(y.a))||x.a.main-y.a.main);
    pick=all[0]&&all[0].c;
  }
  if(!pick)return toast('沒有可出的牌,請按「不出」');
  S.sel=new Set(pick.map(c=>c.id));renderHand();
}

/* ---------- 畫面 ---------- */
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1600);}
const rankLabel=v=>LAB[v]||String(v);
function cardEl(c,k,rel){
  const d=document.createElement('div');
  d.className='cd'+(rel?' rel':'')+(((c.v<16&&(c.s==1||c.s==3))||c.v==17)?' red':'')+(c.v>=16?' jk':'');
  d.style.setProperty('--k',k);
  d.innerHTML=c.v>=16?`<span class="r">${c.v==16?'小':'大'}</span><span class="s">王</span>`
                     :`<span class="r">${LAB[c.v]||c.v}</span><span class="s">${SUITS[c.s]}</span>`;
  return d;
}
function typeText(a){
  if(a.type=='single')return '單張 '+rankLabel(a.main);
  if(a.type=='pair')return '對 '+rankLabel(a.main);
  if(a.type=='triple')return '三條 '+rankLabel(a.main);
  if(a.type=='bomb')return '炸彈 '+rankLabel(a.main);
  return TYPE[a.type];
}
function roleOf(seat){
  if(S.landlord<0)return '';
  if(seat==S.landlord)return '地主';
  return (S.landlord==0||seat==0)?'農民':'農民(隊友)';
}
const CROWN='<svg width="18" height="18" viewBox="0 0 24 24" fill="#8A5A00" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>';
function chip(seat){
  const el=$('#p'+seat),n=S.hands[seat].length,inGame=(S.phase=='bid'||S.phase=='play');
  const isL=seat==S.landlord,role=roleOf(seat);
  let st,cls='t-gray';
  if(S.phase=='bid'){st=S.say[seat]||(S.turn==seat?'叫分中':'等待中');if(S.say[seat])cls='t-blue';}
  else if(S.phase=='end'||S.phase=='redeal'){st='';}
  else if(S.turn==seat){st='出牌中';cls='t-blue';}
  else if(S.table[seat]=='pass'){st='不出';}
  else if(S.last&&S.last.seat==seat){st='剛出牌';cls='t-blue';}
  else st='等待中';
  if(S.phase=='play'&&n<=3&&n>0){st='只剩 '+n+' 張';cls='t-red';}
  el.className='chip'+(inGame&&S.turn==seat?' turn':'');
  const avBg=isL?'#FFE9B8':(S.landlord<0?'#E8ECF4':'#DCEBFF');
  const roleColor=isL?'#8A5A00':'#1F4FC4';
  el.innerHTML=`<div class="who"><div class="av" style="background:${avBg};color:#1F4FC4">${isL?CROWN:(seat==1?'A':'B')}</div>`+
    `<div class="nm"><span>${NAMES[seat]}</span><span style="color:${roleColor}">${role||'&nbsp;'}</span></div>`+
    `<span class="sc${S.scores[seat]<0?' neg':''}">${S.scores[seat]>0?'+':''}${S.scores[seat]}</span></div>`+
    `<div class="bt"><div class="num"><b>${n}</b><span>張</span></div>${st?`<span class="tag ${cls}">${st}</span>`:''}</div>`;
}
function renderTop(){
  $('#pBase').innerHTML='底分 <b>'+(S.highBid||'—')+'</b>';
  $('#pMult').innerHTML='倍數 <b style="color:'+(S.mult>1?'#D92D3A':'#1B2333')+'">×'+S.mult+'</b>';
  $('#top').classList.toggle('hb',S.phase=='play'||S.phase=='end');
  const bt=$('#bottom');bt.innerHTML='';
  S.bottom.forEach(c=>{
    if(S.landlord>=0)bt.appendChild(cardEl(c,.5,true));
    else{const d=document.createElement('div');d.className='cd rel back';d.style.setProperty('--k',.5);bt.appendChild(d);}
  });
  const sc=S.scores[0];$('#score').textContent=(sc>0?'+':'')+sc;$('#score').className=sc<0?'neg':'';
}
function renderTable(){
  const t=$('#table');
  if(S.phase=='bid'){
    t.innerHTML=`<div class="cap">叫地主${S.highSeat>=0?' · 目前最高 '+NAMES[S.highSeat]+' '+S.highBid+'分':''}</div>`+
      `<div class="big">${S.turn==0?'輪到你叫分':NAMES[S.turn]+'叫分中…'}</div>`;
    if(S.turn==0){
      const tb=document.createElement('div');tb.className='tb';
      const add=(txt,v,pri)=>{const x=document.createElement('button');x.className='tbtn'+(pri?' pri':'');x.textContent=txt;x.onclick=()=>bid(v);tb.appendChild(x);};
      add('不叫',0,false);for(let i=S.highBid+1;i<=3;i++)add(i+'分',i,i==3);
      t.appendChild(tb);
    }
    return;
  }
  if(S.phase=='redeal'){t.innerHTML=`<div class="big">三人都不叫,重新發牌…</div>`;return;}
  if(S.last){
    const L=S.last,n=L.cards.length;
    t.innerHTML=`<div class="cap">${NAMES[L.seat]}${roleOf(L.seat)?' · '+roleOf(L.seat):''} 出牌</div><div class="play" id="playcards"></div>`+
      `<div class="big">${typeText(L.a)}</div>`+
      (S.phase=='play'&&S.turn==0&&!(n>4&&t.clientHeight<340)?`<div class="hint">${L.a.type=='rocket'?'王炸無法壓過,請按「不出」':'需要壓過:更大的'+TYPE[L.a.type]+'<br>或炸彈、王炸'}</div>`:'');
    // 桌面牌:疊排成 1~3 行,選出最大而不被裁掉的尺寸
    const box=$('#playcards');
    const tw=Math.max(120,t.clientWidth-24);
    const kids=[...t.children].filter(x=>x!==box);
    const gp=parseFloat(getComputedStyle(t).gap)||12;
    const chrome=kids.reduce((a,x)=>a+(x.offsetHeight||34),0)+gp*kids.length;
    const availH=Math.max(90,(t.clientHeight||330)-20-chrome);
    const STEP=.6,ROWH=.8,ASP=1.4375,maxW=n<=4?110:84;
    let best=null;
    for(let r=1;r<=3;r++){
      const m=Math.ceil(n/r);
      const cw=Math.min(maxW,tw/(1+(m-1)*STEP),availH/(ASP*(1+ROWH*(r-1))));
      if(!best||cw>best.cw*1.1)best={r,m,cw};
    }
    const cw=Math.max(30,best.cw),ch=cw*ASP,step=n>1?Math.min(cw*(n<=4?1.1:STEP),(tw-cw)/Math.max(1,best.m-1)):0;
    const sorted=L.cards.slice().sort((a,b)=>b.v-a.v||a.s-b.s);
    const W=cw+(best.m-1)*step,H=ch*(1+ROWH*(best.r-1));
    box.style.cssText=`position:relative;display:block;flex:none;width:${W}px;height:${H}px`;
    sorted.forEach((c,i)=>{
      const row=Math.floor(i/best.m),col=i%best.m,inRow=Math.min(best.m,n-row*best.m);
      const d=cardEl(c,cw/64,false);
      d.style.left=((best.m-inRow)*step/2+col*step)+'px';d.style.top=(row*ch*ROWH)+'px';d.style.zIndex=col+1;
      box.appendChild(d);
    });
  }else{
    t.innerHTML=`<div class="cap">新一輪</div><div class="big">${S.turn==0?'你先出牌':NAMES[S.turn]+'先出牌'}</div><div class="hint">可以出任何合法牌型</div>`;
  }
}
function renderStatus(){
  const inGame=(S.phase=='bid'||S.phase=='play'),me=roleOf(0);
  const txt=!inGame?'':S.phase=='bid'?'最高分者當地主':(S.turn==0?'輪到你出牌':NAMES[S.turn]+'思考中…');
  $('#status').innerHTML=`<div class="a"><span class="tag t-blue">你${me?' · '+me:''}</span><span>${txt}</span></div>`+
    `<div class="b">剩 <b>${S.hands[0].length}</b> 張</div>`;
}
/* 手牌:依螢幕寬高自動決定牌大小與排數,牌距不少於牌寬的 58% */
function renderHand(){
  const box=$('#handbox'),h=S.hands[0];box.innerHTML='';
  const n=h.length;if(!n){box.style.height='0px';return;}
  const W=box.clientWidth||360,vh=window.innerHeight||800;
  const land=window.innerWidth/vh>=1.25;
  const Hmax=vh*(land?.34:.33),STEP=.58,ASP=1.4375,RAISE=.15,OVER=.92;
  let best=null;
  for(let r=1;r<=3;r++){
    const m=Math.ceil(n/r);
    const cw=Math.min(100,W/(1+(m-1)*STEP),Hmax/(ASP*(1+OVER*(r-1)+RAISE)));
    if(!best||cw>best.cw*1.12)best={r,m,cw};
  }
  const cw=Math.max(40,best.cw),ch=cw*ASP,r=best.r;
  const rows=[];for(let i=0;i<r;i++)rows.push(h.slice(i*best.m,(i+1)*best.m));
  const raise=ch*RAISE;
  box.style.height=Math.round(ch*(1+OVER*(r-1))+raise)+'px';
  box.style.setProperty('--raise',raise+'px');
  const step=Math.min(cw*.9,best.m>1?(W-cw)/(best.m-1):0);
  const rowW=cw+(best.m-1)*step,off=Math.max(0,(W-rowW)/2);
  rows.forEach((row,ri)=>row.forEach((c,i)=>{
    const d=cardEl(c,cw/64);
    d.style.left=(off+i*step)+'px';d.style.top=(raise+ri*ch*OVER)+'px';d.style.zIndex=ri+1;
    if(S.sel.has(c.id)){d.classList.add('sel');}
    d.onclick=()=>{S.sel.has(c.id)?S.sel.delete(c.id):S.sel.add(c.id);renderHand();};
    box.appendChild(d);
  }));
}
function renderBtns(){
  const b=$('#btns');b.innerHTML='';b.style.display=S.phase=='bid'?'none':'';
  if(S.turn!=0||(S.phase!='bid'&&S.phase!='play'))return;
  const add=(t,fn,dis,cls)=>{const x=document.createElement('button');x.className='btn'+(cls?' '+cls:'');x.textContent=t;x.disabled=!!dis;x.onclick=fn;b.appendChild(x);};
  if(S.phase=='bid'){add('不叫',()=>bid(0));for(let i=1;i<=3;i++)add(i+'分',()=>bid(i),i<=S.highBid,i==3?'pri':'');}
  else{add('不出',humanPass,!S.last);add('提示',humanHint);add('出牌',humanPlay,false,'pri');}
}
function render(){
  renderTop();chip(1);chip(2);renderStatus();renderBtns();renderHand();renderTable();
  if(S.phase=='end'){
    const r=S.result,me=r.lw?S.landlord==0:S.landlord!=0;
    $('#ovt').textContent=me?'🎉 你贏了':'😢 你輸了';
    $('#ovd').innerHTML=`${r.lw?'地主':'農民'}勝利${r.spring?'(春天 ×2)':''}｜倍數 ×${r.m}<br>累計:你 ${S.scores[0]} ｜ 電腦A ${S.scores[1]} ｜ 電腦B ${S.scores[2]}`;
    $('#ov').style.display='flex';
  }
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>S&&render(),60);});
newGame();
</script>
